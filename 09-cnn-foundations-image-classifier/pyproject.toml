[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cnn-foundations"
version = "1.0.0"
description = "Inspectable FashionMNIST CNN laboratory"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "numpy==1.26.4",
  "Pillow==10.4.0",
  "pydantic==2.11.7",
  "PyYAML==6.0.2",
  "scikit-learn==1.5.2",
  "torch==2.9.0",
  "torchvision==0.24.0",
  "uvicorn==0.35.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "backend"]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["cnn_foundations", "app"]
mypy_path = ["src", "backend"]
exclude = ["frontend"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "torchvision.*", "PIL.*", "yaml.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "backend", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

