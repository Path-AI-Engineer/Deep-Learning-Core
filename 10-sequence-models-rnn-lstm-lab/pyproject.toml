[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sequence-memory-lab"
version = "1.0.0"
description = "Inspectable RNN, LSTM and GRU laboratory for multivariate sequences"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "numpy==1.26.4",
  "pydantic==2.11.7",
  "PyYAML==6.0.2",
  "scikit-learn==1.5.2",
  "torch==2.9.0",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.17.1",
  "pytest==8.3.5",
  "pytest-cov==6.2.1",
  "ruff==0.12.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "backend"]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["sequence_models", "app"]
mypy_path = ["src", "backend"]
exclude = ["frontend"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "yaml.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "backend", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
