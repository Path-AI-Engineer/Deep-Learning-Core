[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pytorch-tabular-studio"
version = "1.0.0"
description = "Reproducible PyTorch regression and multiclass classification served by FastAPI."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "numpy==1.26.4",
  "pandas==2.2.3",
  "pydantic==2.11.7",
  "PyYAML==6.0.2",
  "scikit-learn==1.5.2",
  "torch==2.9.0",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.15.0",
  "pytest==8.3.5",
  "pytest-cov==6.0.0",
  "ruff==0.11.13",
]

[tool.setuptools.packages.find]
where = ["src", "backend"]
include = ["pytorch_tabular*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "backend"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src:backend"
packages = ["pytorch_tabular", "app"]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
